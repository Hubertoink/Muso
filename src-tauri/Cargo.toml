[package]
name = "muso"
version = "0.1.41"
description = "Muso – a minimalist digital record crate"
edition = "2021"
license = "MIT"
authors = ["Hubertoink"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.21"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
audio2mp3-core = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.15"
socket2 = "0.6"
symphonia = { version = "0.5", features = ["all"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
httpdate = "1"
base64 = "0.22"
percent-encoding = "2"
tempfile = "3"
fastrand = "2"
zip = { version = "9.7", default-features = false }
open = "5"
tokio = { version = "1", features = ["time", "sync", "net", "io-util", "macros"] }
tauri-plugin-updater = "2"
id3 = "1.17.4"

# Image decoding / audio decoding are painfully slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
tauri-plugin-opener = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[patch.crates-io]
# Rodio 0.20 uses Symphonia 0.5. Backport the silent MP3 granule fix from
# https://github.com/pdeljanov/Symphonia/pull/528 until the 0.5 series includes it.
symphonia-bundle-mp3 = { path = "vendor/symphonia-bundle-mp3" }
